services:
  equisight-backend:
    build: .
    ports:
      - "8002:8002"
    environment:
      - SECRET_KEY=your-development-secret-key
      - ENVIRONMENT=development
    volumes:
      - ./equisight-backend.db:/app/equisight-backend.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
